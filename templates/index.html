<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LAN Share</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        main {
            max-width: 800px;
            margin: auto;
        }

        .panel {
            background: white;
            padding: 24px;
            margin-bottom: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 16px #00000008;
        }

        h1 {
            color: #2563eb;
        }

        h2 {
            font-size: 20px;
        }

        input,
        button {
            font: inherit;
        }

        input[type="file"] {
            width: 100%;
            margin: 16px 0;
        }

        button,
        .download {
            display: inline-block;
            padding: 10px 14px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .delete {
            background: #dc2626;
        }

        .file {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px 0;
            border-bottom: 1px solid #e2e8f0;
            overflow-wrap: anywhere;
        }

        .file:last-child {
            border-bottom: 0;
        }

        .file-info {
            min-width: 0;
        }

        .muted {
            color: #64748b;
            font-size: 14px;
        }

        .message {
            padding: 12px;
            margin: 10px 0;
            background: #eff6ff;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .actions form {
            margin: 0;
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
            }

            .panel {
                padding: 16px;
            }

            .file {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main>
        <section class="panel">
            <h1>LAN Share</h1>
            <p>ส่งไฟล์ภายในเครือข่ายของคุณ</p>
            <p class="muted">ไฟล์จะถูกเก็บไว้บนคอมที่รันเซิร์ฟเวอร์</p>
        </section>

        <section class="panel">
            <h2>อัปโหลดไฟล์</h2>


            <form id="uploadForm" action="{{ url_for('upload_file') }}" method="post" enctype="multipart/form-data">

                <label for="file">เลือกไฟล์ที่ต้องการส่ง</label>
                <input id="file" type="file" name="file" required>

                <button id="uploadButton" type="submit">
                    อัปโหลดไฟล์
                </button>

                <div id="uploadStatus" class="message" hidden></div>

                <div id="progressArea" hidden>
                    <p id="progressText">กำลังเตรียมอัปโหลด...</p>

                    <progress id="progressBar" value="0" max="100" style="width:100%; height:24px;">
                    </progress>
                </div>
            </form>

        </section>

        <section class="panel">
            <h2>ไฟล์ทั้งหมด ({{ files|length }})</h2>

            {% for file in files %}
            <div class="file">
                <div class="file-info">
                    <strong>{{ file.name }}</strong>
                    <p class="muted">{{ file.size }}</p>
                </div>

                <div class="actions">
                    <a class="download" href="{{ url_for('download_file', filename=file.name) }}">
                        ดาวน์โหลด
                    </a>

                    <form action="{{ url_for('delete_file', filename=file.name) }}" method="post"
                        onsubmit="return confirm('ยืนยันการลบไฟล์นี้?')">
                        <button class="delete" type="submit">ลบ</button>
                    </form>
                </div>
            </div>
            {% else %}
            <p class="muted">ยังไม่มีไฟล์ ลองอัปโหลดไฟล์แรกของคุณ</p>
            {% endfor %}
        </section>
    </main>

    <script>
        const form = document.getElementById("uploadForm");
        const fileInput = document.getElementById("file");
        const uploadButton = document.getElementById("uploadButton");
        const uploadStatus = document.getElementById("uploadStatus");
        const progressArea = document.getElementById("progressArea");
        const progressBar = document.getElementById("progressBar");
        const progressText = document.getElementById("progressText");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const file = fileInput.files[0];

            if (!file) {
                showStatus("กรุณาเลือกไฟล์ก่อน", false);
                return;
            }

            const data = new FormData(form);
            const xhr = new XMLHttpRequest();

            uploadButton.disabled = true;
            fileInput.disabled = true;

            progressArea.hidden = false;
            progressBar.value = 0;
            progressText.textContent = "กำลังเริ่มอัปโหลด...";
            showStatus("กำลังส่งไฟล์ " + file.name, true);

            xhr.open("POST", form.action);
            xhr.setRequestHeader("X-Requested-With", "XMLHttpRequest");

            xhr.upload.addEventListener("progress", function (event) {
                if (!event.lengthComputable) {
                    progressText.textContent =
                        "กำลังอัปโหลด " + formatBytes(event.loaded);
                    return;
                }

                const percent = Math.round(
                    event.loaded / event.total * 100
                );

                progressBar.value = percent;
                progressText.textContent =
                    percent + "% (" +
                    formatBytes(event.loaded) + " / " +
                    formatBytes(event.total) + ")";
            });

            xhr.addEventListener("load", function () {
                let result;

                try {
                    result = JSON.parse(xhr.responseText);
                } catch {
                    result = {
                        success: false,
                        message: "เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง"
                    };
                }

                if (xhr.status >= 200 && xhr.status < 300 &&
                    result.success) {
                    progressBar.value = 100;
                    progressText.textContent = "อัปโหลดเสร็จแล้ว";
                    showStatus(result.message, true);

                    setTimeout(function () {
                        window.location.reload();
                    }, 800);
                } else {
                    showStatus(
                        result.message || "อัปโหลดไม่สำเร็จ",
                        false
                    );
                    uploadButton.disabled = false;
                    fileInput.disabled = false;
                }
            });

            xhr.addEventListener("error", function () {
                showStatus(
                    "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบเครือข่าย",
                    false
                );
                uploadButton.disabled = false;
                fileInput.disabled = false;
            });

            xhr.addEventListener("abort", function () {
                showStatus("การอัปโหลดถูกยกเลิก", false);
                uploadButton.disabled = false;
                fileInput.disabled = false;
            });

            xhr.send(data);
        });

        function showStatus(message, success) {
            uploadStatus.hidden = false;
            uploadStatus.textContent = message;
            uploadStatus.style.background =
                success ? "#eff6ff" : "#fef2f2";
            uploadStatus.style.color =
                success ? "#1d4ed8" : "#b91c1c";
        }

        function formatBytes(bytes) {
            const units = ["B", "KB", "MB", "GB", "TB"];
            let size = bytes;
            let index = 0;

            while (size >= 1024 && index < units.length - 1) {
                size /= 1024;
                index++;
            }

            return size.toFixed(1) + " " + units[index];
        }
    </script>

</body>

</html>
