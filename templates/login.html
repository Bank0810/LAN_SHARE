<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LAN Share - Login</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 420px; margin: 48px auto; padding: 16px; background: #f1f5f9; color: #1e293b; }
        main { background: white; padding: 24px; border-radius: 14px; box-shadow: 0 4px 16px #00000008; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; font: inherit; }
        input { border: 1px solid #cbd5e1; border-radius: 8px; }
        button { background: #2563eb; color: white; border: 0; border-radius: 8px; cursor: pointer; }
        .error { color: #b91c1c; }
        .muted { color: #64748b; font-size: 14px; }
    </style>
</head>
<body>
<main>
    <h1>LAN Share</h1>
    <p>กรอก PIN และตั้งชื่อเครื่องก่อนเข้าใช้งาน</p>
    <p class="muted">ตัวอย่างชื่อ: PC-BANK, Laptop, iPhone</p>
    {% for message in get_flashed_messages() %}<p class="error">{{ message }}</p>{% endfor %}
    <form method="post" action="{{ url_for('login') }}">
        <label for="device_name">ชื่อเครื่อง / ชื่อผู้ใช้ที่ต้องการแสดง</label>
        <input id="device_name" name="device_name" maxlength="40" placeholder="เช่น PC-BANK" autocomplete="nickname" required autofocus>
        <label for="pin">PIN</label>
        <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
        <button type="submit">เข้าสู่ระบบ</button>
    </form>
</main>
</body>
</html>
